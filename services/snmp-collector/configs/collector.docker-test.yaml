site_id: "site-001"
collector:
  id: "collector-docker-test"
poll_interval: 60s
max_workers: 1

admin:
  listen: ":9090"

snmp:
  timeout: 5s
  retries: 1

publisher:
  mode: mqtt
  timeout: 10s
  telemetry_version: v2

mqtt:
  broker: "tls://127.0.0.1:8883"
  username: "collector"
  password_env: "MQTT_PASSWORD"
  qos: 1
  tls:
    ca_file: "../../infrastructure/docker/mqtt-broker/certs/ca.crt"

devices:
  - id: "dev-001"
    host: "snmpsim"
    port: 1161
    community_env: "SNMP_COMMUNITY_DEV_001"
    version: "2c"
